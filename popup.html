<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSONL to JSON</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; padding: 1rem; }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
    .drop-zone { border: 2px dashed #30363d; border-radius: 8px; padding: 1.5rem 1rem; text-align: center; cursor: pointer; transition: all 0.2s; background: #161b22; }
    .drop-zone:hover, .drop-zone.drag-over { border-color: #58a6ff; background: #1f2937; }
    .drop-icon { width: 32px; height: 32px; margin: 0 auto 0.5rem; stroke: #58a6ff; }
    .drop-text { font-size: 0.875rem; color: #e6edf3; }
    .drop-hint { font-size: 0.75rem; color: #8b949e; margin-top: 0.25rem; }
    .file-input { display: none; }
    .result { margin-top: 1rem; display: none; }
    .result.show { display: block; }
    .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .result-title { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: #8b949e; }
    .stats { font-size: 0.7rem; color: #8b949e; }
    .actions { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
    .btn { flex: 1; padding: 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; }
    .btn-primary { background: #238636; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .btn-secondary { background: #30363d; color: #e6edf3; border: 1px solid #30363d; }
    .btn-secondary:hover { background: #484f58; border-color: #484f58; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 0.75rem; overflow: auto; max-height: 250px; font-size: 0.7rem; line-height: 1.5; color: #e6edf3; white-space: pre-wrap; word-break: break-word; }
    .toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%) translateY(100px); background: #238636; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.75rem; opacity: 0; transition: all 0.2s; z-index: 100; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: #da3633; }
  </style>
</head>
<body>
  <h1>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    JSONL to JSON
  </h1>

  <div class="drop-zone" id="dropZone">
    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
    </svg>
    <div class="drop-text">Drop .jsonl file here</div>
    <div class="drop-hint">or click to browse</div>
    <input type="file" class="file-input" id="fileInput" accept=".jsonl,.json,.txt">
  </div>

  <div class="result" id="result">
    <div class="result-header">
      <span class="result-title">Converted JSON</span>
      <span class="stats" id="stats"></span>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="copyBtn">Copy</button>
      <button class="btn btn-secondary" id="downloadBtn">Download</button>
    </div>
    <pre id="jsonOutput"></pre>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
